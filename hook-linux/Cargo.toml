[package]
name = "reminedog-hook-linux"
description = "Linux JVMTI agent: the agent with Linux's Os (dlsym, GLX, fontconfig)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# "reminedog" にしない：hook-win は Linux で空の libreminedog.so を作り（この crate は Windows で
# 空の reminedog_linux.dll を作る）、同じ名前のライブラリが 2 つあるとぶつかる。
name = "reminedog_linux"
crate-type = ["cdylib"]

[target.'cfg(target_os = "linux")'.dependencies]
reminedog-agent.workspace = true
reminedog-core.workspace = true
reminedog-render.workspace = true
libc.workspace = true
log.workspace = true
