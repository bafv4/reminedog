[package]
name = "reminedog-hook-macos"
description = "macOS JVMTI agent: the agent with macOS's Os (dlsym, NSOpenGLContext, AppKit)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# "reminedog" にしない：hook-win は macOS で空の libreminedog.dylib を作り、同じ名前の
# ライブラリが 2 つあるとぶつかる（hook-linux と同じ）。
name = "reminedog_macos"
crate-type = ["cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
reminedog-agent.workspace = true
reminedog-core.workspace = true
reminedog-render.workspace = true
libc.workspace = true
log.workspace = true
