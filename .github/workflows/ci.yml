name: CI

# Actions are pinned to full commit hashes (the tag in the comment); Dependabot proposes
# updates (.github/dependabot.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Rust toolchain of the CI and the release (a new stable can bring new lints).
  RUST_TOOLCHAIN: "1.99.0"
  # Mesa release (pal1000/mesa-dist-win) for the smoke test, and the SHA-256 of its
  # mesa3d-<tag>-release-msvc.7z (from the release's assets).
  MESA_TAG: "26.2.4"
  MESA_SHA256: "351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695"

jobs:
  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

      # hook-win is empty off Windows; lint its real code for the GNU Windows target too
      # (MinGW gcc builds the C sources of its minhook dependency).
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Add Windows GNU target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Clippy (hook-win, x86_64-pc-windows-gnu)
        run: cargo clippy --locked -p reminedog-hook-win --target x86_64-pc-windows-gnu -- -D warnings

  # The installer (Kotlin, Swing + FlatLaf): its tests and the jar to double-click.
  installer:
    name: Installer (Kotlin, test, jar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test
        # Through sh: a commit from Windows may not carry gradlew's executable bit.
        run: sh ./gradlew build --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reminedog-installer
          path: installer/build/libs/reminedog-installer.jar
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (clippy, test)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  # The DLL alone, so the smoke tests need not wait for clippy and the tests.
  windows-dll:
    name: Windows (MSVC build)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build agent DLL
        env:
          REMINEDOG_BUILD_ID: ${{ github.sha }}
        run: cargo build --locked --release -p reminedog-hook-win

      - name: Check the DLL (x64, exports, imports, version resource)
        run: ./ci/check-dll.ps1 -Dll target/release/reminedog.dll

      - name: Stage artifact
        run: |
          $dist = Join-Path $env:RUNNER_TEMP dist
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target\release\reminedog.dll $dist  # required; fails the step if missing
          foreach ($optional in 'target\release\reminedog.pdb', 'README.md', 'docs') {
            if (Test-Path $optional) { Copy-Item $optional $dist -Recurse }
          }
          Get-ChildItem $dist -Recurse -File | ForEach-Object FullName
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reminedog-windows-x64
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30

  # Load the DLL into real Windows JVMs running an LWJGL/GLFW window like Minecraft's,
  # rendered by Mesa llvmpipe (the runners have no GPU).
  smoke-windows:
    name: Smoke (LWJGL ${{ matrix.lwjgl }}, Java ${{ matrix.java }})
    needs: windows-dll
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minecraft 1.14-1.16: Java 8, default window hints (compatibility context).
          - lwjgl: "3.2.2"
            java: "8"
            hints: --legacy
            readback: --readback
            harness: Smoke
            modules: ""
            markers: "GLFW hooks installed|overlay: first frame rendered"
          # Minecraft 1.20.5+: Java 21, OpenGL 3.2 core context; rendering into its own
          # framebuffer and copying it to the window, as Minecraft does (--mc), through the
          # agent's OpenGL wrappers.
          - lwjgl: "3.3.3"
            java: "21"
            hints: --mc
            readback: --readback
            harness: Smoke
            modules: ""
            markers: "GLFW hooks installed|OpenGL hooks installed|overlay: first frame rendered"
          # Minecraft 26.x: Java 25, window opened with SDL3 instead of GLFW; the context is
          # created on a hidden utility window and used on the game window, as 26.3 does.
          - lwjgl: "3.4.3"
            java: "25"
            hints: --mc
            readback: ""
            harness: SmokeSdl
            modules: lwjgl-sdl
            markers: "SDL3 hooks installed|OpenGL hooks installed|renderer: OpenGL via SDL3|overlay: first frame rendered"
    defaults:
      run:
        shell: bash
    env:
      GALLIUM_DRIVER: llvmpipe
      SMOKE_FRAMES: "180"
      SMOKE_HARNESS: ${{ matrix.harness }}
      LWJGL_MODULES: ${{ matrix.modules }}
      SMOKE_MARKERS: ${{ matrix.markers }}
    steps:
      # No token in the working copy: the JVMs below run third-party code (Mesa, LWJGL).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reminedog-windows-x64
          path: ${{ runner.temp }}/agent
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Mesa and LWJGL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/downloads/mesa
            ${{ runner.temp }}/downloads/lwjgl
          key: smoke-mesa${{ env.MESA_TAG }}-lwjgl${{ matrix.lwjgl }}-${{ hashFiles('ci/smoke/lwjgl.sha256') }}

      # GLFW (and the agent) load "opengl32.dll" by name, so a copy next to java.exe wins
      # over the system's GDI software renderer.
      - name: Install Mesa llvmpipe next to java.exe
        run: |
          downloads=$(cygpath -u "$RUNNER_TEMP")/downloads/mesa
          archive=$downloads/mesa3d-$MESA_TAG-release-msvc.7z
          mkdir -p "$downloads"
          if [ ! -s "$archive" ]; then
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_TAG/mesa3d-$MESA_TAG-release-msvc.7z"
          fi
          got=$(sha256sum "$archive" | cut -d ' ' -f 1)
          if [ "$got" != "$MESA_SHA256" ]; then
            rm -f "$archive"
            echo "::error::mesa3d-$MESA_TAG-release-msvc.7z has the SHA-256 $got, not $MESA_SHA256"
            exit 1
          fi
          mesa=$(cygpath -u "$RUNNER_TEMP")/mesa
          mkdir -p "$mesa"
          7z x -y -bso0 -bsp0 "-o$(cygpath -w "$mesa")" "$(cygpath -w "$archive")"

          x64=
          for candidate in "$mesa"/x64/opengl32.dll "$mesa"/*/x64/opengl32.dll; do
            if [ -f "$candidate" ]; then x64=$(dirname "$candidate"); break; fi
          done
          if [ -z "$x64" ]; then
            echo "::error::x64/opengl32.dll not found in $archive"
            exit 1
          fi
          java_bin=$(cygpath -u "$JAVA_HOME")/bin
          for name in opengl32.dll libgallium_wgl.dll libglapi.dll; do
            if [ -f "$x64/$name" ]; then cp -v "$x64/$name" "$java_bin/"; fi
          done

      - name: Fetch LWJGL and compile the harness
        env:
          LWJGL_VERSION: ${{ matrix.lwjgl }}
          JAVA_MAJOR: ${{ matrix.java }}
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          java_bin=$(cygpath -u "$JAVA_HOME")/bin
          jar_list=$(LWJGL_EXTRA_MODULES="$LWJGL_MODULES" bash ci/smoke/fetch-lwjgl.sh "$LWJGL_VERSION" "$tmp/downloads/lwjgl/$LWJGL_VERSION")
          mapfile -t jars <<<"$jar_list"
          jar_cp=$(cygpath -w "${jars[@]}" | paste -sd ';' -)
          classes=$(cygpath -w "$tmp/classes")

          # JDK 8's javac has no --release; its own class library is Java 8's anyway.
          if [ "$JAVA_MAJOR" = 8 ]; then release=(-source 8 -target 8); else release=(--release 8); fi
          mkdir -p "$tmp/classes"
          "$java_bin/javac" "${release[@]}" -Xlint:-options -encoding UTF-8 -cp "$jar_cp" -d "$classes" "ci/smoke/$SMOKE_HARNESS.java" ci/smoke/SmokeImage.java

          # Paths handed to java.exe are Windows paths; SMOKE_ROOT is only used by bash.
          {
            printf 'JAVA=%s\n' "$java_bin/java"
            printf 'AGENT=%s\n' "$(cygpath -w "$tmp/agent/reminedog.dll")"
            printf 'SMOKE_CP=%s\n' "$jar_cp;$classes"
            printf 'SMOKE_ROOT=%s\n' "$tmp/smoke"
          } >>"$GITHUB_ENV"

      - name: "Step A: JVM starts with the agent (java -version)"
        timeout-minutes: 5
        run: |
          dir=$SMOKE_ROOT/version
          mkdir -p "$dir" && cd "$dir"
          status=0
          "$JAVA" "-agentpath:$AGENT" -version 2>&1 | tee java.txt || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::java -version with the agent exited with $status"
            exit 1
          fi
          if ! grep -qF "agent loaded" reminedog/reminedog.log; then
            echo "::error::the agent did not write 'agent loaded' to $dir/reminedog/reminedog.log"
            exit 1
          fi

      # Same run without the agent, so a failure below can be told apart from a runner problem.
      - name: "Step B (baseline): harness without the agent"
        timeout-minutes: 5
        env:
          SMOKE_HINTS: ${{ matrix.hints }}
          SMOKE_READBACK: ${{ matrix.readback }}
        run: |
          dir=$SMOKE_ROOT/baseline
          mkdir -p "$dir" && cd "$dir"
          natives=$(cygpath -w "$dir/natives")
          status=0
          "$JAVA" "-Dorg.lwjgl.system.SharedLibraryExtractPath=$natives" -cp "$SMOKE_CP" \
            "$SMOKE_HARNESS" "$SMOKE_FRAMES" ${SMOKE_READBACK:+"$SMOKE_READBACK"} ${SMOKE_HINTS:+"$SMOKE_HINTS"} 2>&1 | tee smoke.txt || status=$?
          fail=0
          [ "$status" -eq 0 ] || { echo "::error::baseline harness exited with $status"; fail=1; }
          grep -qF "SMOKE OK" smoke.txt || { echo "::error::baseline harness did not print 'SMOKE OK'"; fail=1; }
          grep -qF "GL_RENDERER llvmpipe" smoke.txt || { echo "::error::baseline is not rendering with Mesa llvmpipe"; fail=1; }
          exit "$fail"

      - name: "Step B: harness with the agent"
        timeout-minutes: 5
        env:
          SMOKE_HINTS: ${{ matrix.hints }}
          SMOKE_READBACK: ${{ matrix.readback }}
        run: |
          dir=$SMOKE_ROOT/agent
          mkdir -p "$dir" && cd "$dir"
          natives=$(cygpath -w "$dir/natives")
          status=0
          # --screenshot saves the back buffer after the last swap (smoke-screenshot.png, uploaded
          # below); whether it still shows the overlay depends on the driver's swap method.
          "$JAVA" "-agentpath:$AGENT" "-Dorg.lwjgl.system.SharedLibraryExtractPath=$natives" -cp "$SMOKE_CP" \
            "$SMOKE_HARNESS" "$SMOKE_FRAMES" ${SMOKE_READBACK:+"$SMOKE_READBACK"} --screenshot ${SMOKE_HINTS:+"$SMOKE_HINTS"} 2>&1 | tee smoke.txt || status=$?
          fail=0
          [ "$status" -eq 0 ] || { echo "::error::harness with the agent exited with $status"; fail=1; }
          grep -qF "SMOKE OK" smoke.txt || { echo "::error::harness with the agent did not print 'SMOKE OK'"; fail=1; }
          log=reminedog/reminedog.log
          IFS='|' read -ra markers <<<"agent loaded|$SMOKE_MARKERS"
          for marker in "${markers[@]}"; do
            grep -qF "$marker" "$log" || { echo "::error::agent log lacks '$marker'"; fail=1; }
          done
          if grep -F "[ERROR]" "$log"; then
            echo "::error::agent log has [ERROR] lines"
            fail=1
          fi
          exit "$fail"

      - name: Show agent logs
        if: always()
        run: |
          [ -n "${SMOKE_ROOT:-}" ] || exit 0
          shopt -s nullglob
          for log in "$SMOKE_ROOT"/*/reminedog/*.log; do
            echo "===== $log"
            cat "$log"
          done
          # A JVM crash (e.g. in the agent) leaves hs_err_pid*.log in the working directory.
          for crash in "$SMOKE_ROOT"/*/hs_err_pid*.log; do
            echo "===== $crash (first 80 lines)"
            head -n 80 "$crash"
          done
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs-lwjgl${{ matrix.lwjgl }}-java${{ matrix.java }}
          path: |
            ${{ runner.temp }}/smoke/*/reminedog/
            ${{ runner.temp }}/smoke/*/*.txt
            ${{ runner.temp }}/smoke/*/*.png
            ${{ runner.temp }}/smoke/*/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 30
