name: Release

# main で Actions のタブから版を入れて手で動かす。そのコミットで CI が通ってから。
# DLL とインストーラーを、その版を名前と中身（DLL のバージョン情報のリソースとログ、
# インストーラーの manifest とウィンドウのタイトル）に入れてビルドし、動かしたコミットに
# 下書きのリリース v<version> を作る。下書きを（GitHub で）公開するとタグができる。
# リポジトリの版の番号（Cargo.toml）は変えない。
#
# リリースするものは、キャッシュなしで、CI の固定したツールチェーンと固定した依存でビルドする。
# アクションはコミットのハッシュで固定する（タグはコメントに）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 or 1.2.0-beta.1 (the release is v<version>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  # ci.yml と同じ。
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  check:
    name: Check the version and the commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # このコミットの CI の実行を探すため。
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the version, the branch, the tag, the release and the CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.0 or 1.2.0-beta.1"
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::releases are made from main, not $GITHUB_REF"
            exit 1
          fi
          # 「見つからない」だけはリリースを続ける。ほかの失敗では止める。
          if output=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1); then
            echo "::error::the tag v$VERSION exists already"
            exit 1
          elif ! grep -q "HTTP 404" <<<"$output"; then
            echo "::error::cannot look up the tag v$VERSION: $output"
            exit 1
          fi
          # 公開済みのリリース（下書きは、それを見られるジョブがもう一度確かめる）。
          if output=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "::error::a release v$VERSION exists already"
            exit 1
          elif ! grep -qi "not found" <<<"$output"; then
            echo "::error::cannot look up the release v$VERSION: $output"
            exit 1
          fi
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --limit 1 --json databaseId --jq length)
          if [ "$runs" -lt 1 ]; then
            echo "::error::the CI has not passed on $GITHUB_SHA (wait for it, or run it)"
            exit 1
          fi

  dll:
    name: DLL (MSVC)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Toolchain
        run: |
          rustc -Vv
          "``````text`n$(rustc -Vv | Out-String)``````" >> $env:GITHUB_STEP_SUMMARY

      # clippy とテストは、このコミットの CI で動いた（check のジョブがそれを求める）。
      - name: Build agent DLL
        env:
          REMINEDOG_VERSION: ${{ env.VERSION }}
          REMINEDOG_BUILD_ID: ${{ github.sha }}
        run: cargo build --locked --release -p reminedog-hook-win
      - name: Check the DLL (x64, exports, imports, version resource)
        run: ./ci/check-dll.ps1 -Dll target/release/reminedog.dll -Version $env:VERSION

      - name: Stage files
        run: |
          $dist = Join-Path $env:RUNNER_TEMP dist
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target\release\reminedog.dll (Join-Path $dist "reminedog-$env:VERSION.dll")
          Copy-Item target\release\reminedog.pdb (Join-Path $dist "reminedog-$env:VERSION.pdb")
          Get-ChildItem $dist | ForEach-Object Name
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dll
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Installer
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        # sh を通す：Windows からのコミットには gradlew の実行のビットがないことがある。
        run: sh ./gradlew build --no-daemon "-PreminedogVersion=$VERSION"
      - name: Check the jar's version
        run: |
          jar="build/libs/reminedog-installer-$VERSION.jar"
          unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx "Implementation-Version: $VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          path: installer/build/libs/reminedog-installer-${{ env.VERSION }}.jar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: [dll, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # ファイルのビルドの来歴（公開のリポジトリだけ）。
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Check that no release v${{ env.VERSION }} exists, drafts included
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 下書きは、このジョブのものと同じく、リポジトリに書けるトークンにだけ一覧に出る。
          found=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq "[.[] | select(.tagName == \"v$VERSION\")] | length")
          if [ "$found" -ne 0 ]; then
            echo "::error::a release v$VERSION exists already (maybe a draft)"
            exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # 1.2.0-beta.1 のような版はプレリリースで、インストーラーの「最新」は飛ばす。
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft "${prerelease[@]}" \
            --target "$GITHUB_SHA" \
            --title "reminedog $VERSION" \
            --generate-notes \
            "dist/reminedog-$VERSION.dll" \
            "dist/reminedog-$VERSION.pdb" \
            "dist/reminedog-installer-$VERSION.jar"
          echo "Draft: $(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
