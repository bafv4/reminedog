[workspace]
resolver = "3"
members = ["core", "render", "agent", "hook-win", "hook-linux", "hook-macos"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
reminedog-core = { path = "core" }
reminedog-render = { path = "render" }
reminedog-agent = { path = "agent" }

egui = "0.36"
# egui_glow 0.36 は glow 0.17 でビルドされている。版をそろえて上げる。
egui_glow = { version = "0.36", default-features = false }
# level.dat は gzip した NBT（シングルプレイのワールドの名前）。
flate2 = "1"
glow = "0.17"
# Linux と macOS のエージェントの dlsym、dlinfo、dlopen。
libc = "0.2"
log = { version = "0.4", features = ["std"] }
regex = "1"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
# webview2-com 0.39 は windows 0.62 でビルドされている。版をそろえて上げる。
webview2-com = "0.39"
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"
windows-sys = "0.61"

[profile.release]
# フックはパニックでゲームを落とさないように catch_unwind に頼るので、unwind のままにする。
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
