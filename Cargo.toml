[workspace]
resolver = "3"
members = ["core", "render", "hook-win"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
reminedog-core = { path = "core" }
reminedog-render = { path = "render" }

egui = "0.36"
# egui_glow 0.36 is built against glow 0.17; keep them in lockstep.
egui_glow = { version = "0.36", default-features = false }
glow = "0.17"
log = { version = "0.4", features = ["std"] }
regex = "1"
retour = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
windows-sys = "0.61"

[profile.release]
# Hooks rely on catch_unwind to keep panics from crashing the game, so unwinding must stay on.
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
