[workspace]
resolver = "3"
members = ["core", "render", "hook-win"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
reminedog-core = { path = "core" }
reminedog-render = { path = "render" }

egui = "0.36"
# egui_glow 0.36 is built against glow 0.17; keep them in lockstep.
egui_glow = { version = "0.36", default-features = false }
glow = "0.17"
log = { version = "0.4", features = ["std"] }
regex = "1"
# retour 0.3 mis-relocates RIP-relative instructions followed by an immediate. GLFW's init
# check (cmp [rip+_glfw.initialized], 0) sits in the first bytes of most of its API functions
# (the very first instruction of glfwSwapBuffers), inside the patched prologue. MinHook is fine.
minhook = "0.9"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
# webview2-com 0.39 is built against windows 0.62; keep them in lockstep.
webview2-com = "0.39"
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"
windows-sys = "0.61"

[profile.release]
# Hooks rely on catch_unwind to keep panics from crashing the game, so unwinding must stay on.
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
